<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Engine - AI Decision Simulation Platform</title>
    <script>
      // Defensive guard: allow window.fetch assignment without throwing when polyfills set global.fetch
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() { return _fetch; },
          set(fn) { _fetch = fn; },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
