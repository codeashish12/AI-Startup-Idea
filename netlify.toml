[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["crypto"]

# Redirect all API calls to the auth function
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

# SPA fallback - keep this last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

